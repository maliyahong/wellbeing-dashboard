<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekly Wellbeing Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #070b12;
      --bg-top: #0f1726;
      --panel: rgba(15, 21, 33, 0.92);
      --panel-strong: rgba(22, 30, 45, 0.98);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f4f7fb;
      --muted: #9ea9bb;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.36);
      --red: #ff5d5d;
      --red-soft: rgba(255, 93, 93, 0.14);
      --orange: #ffb347;
      --orange-soft: rgba(255, 179, 71, 0.14);
      --green: #4fd58b;
      --green-soft: rgba(79, 213, 139, 0.14);
      --blue: #7cb8ff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top left, rgba(255, 93, 93, 0.12), transparent 30%),
        radial-gradient(circle at top right, rgba(79, 213, 139, 0.1), transparent 26%),
        linear-gradient(180deg, var(--bg-top) 0%, var(--bg) 70%);
      color: var(--text);
      font-family: "IBM Plex Sans", sans-serif;
    }

    button, select { font: inherit; }
    #root { min-height: 100vh; }

    .app-shell {
      width: min(1320px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 36px;
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      margin-bottom: 22px;
      padding: 22px 24px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: rgba(10, 16, 27, 0.9);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .header-copy { display: grid; gap: 8px; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.78rem;
    }

    h1, h2, h3 {
      margin: 0;
      font-family: "Space Grotesk", sans-serif;
    }

    h1 {
      font-size: clamp(2rem, 4vw, 3.4rem);
      line-height: 0.96;
      max-width: 11ch;
    }

    .header-copy p,
    .panel-subtitle,
    .stat-note,
    .insight-text,
    .resource-copy,
    .footer-note,
    .metric-caption,
    .timeline-copy {
      margin: 0;
      color: var(--muted);
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      justify-content: flex-end;
    }

    .control {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
    }

    .control label {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .control select {
      border: 0;
      background: transparent;
      color: var(--text);
      outline: none;
      min-width: 170px;
    }

    .connect-button {
      border: 0;
      border-radius: 16px;
      padding: 13px 18px;
      background: linear-gradient(135deg, #163559 0%, #244d7d 100%);
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .connect-button:hover { filter: brightness(1.08); }

    .summary-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 18px;
      margin-bottom: 18px;
    }

    .hero-card,
    .insight-card,
    .heads-up,
    .panel-card {
      border: 1px solid var(--border);
      border-radius: 26px;
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .hero-card {
      position: relative;
      padding: 26px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0)),
        var(--panel);
    }

    .hero-card::after {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      right: -40px;
      top: -60px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(124, 184, 255, 0.24) 0%, transparent 72%);
      pointer-events: none;
    }

    .hero-metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-top: 24px;
    }

    .mini-stat {
      padding: 16px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .mini-stat strong {
      display: block;
      margin-top: 10px;
      font-size: 1.7rem;
      font-family: "Space Grotesk", sans-serif;
    }

    .insight-stack { display: grid; gap: 18px; }

    .insight-card,
    .heads-up {
      padding: 22px;
      background: var(--panel-strong);
    }

    .insight-tag,
    .severity-pill,
    .resource-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .insight-tag {
      background: rgba(124, 184, 255, 0.14);
      color: #b6d7ff;
    }

    .heads-up {
      border-color: rgba(255, 93, 93, 0.24);
      background:
        linear-gradient(180deg, rgba(255, 93, 93, 0.08), rgba(255, 93, 93, 0.03)),
        var(--panel-strong);
    }

    .severity-pill {
      background: rgba(255, 93, 93, 0.16);
      color: #ff9a9a;
    }

    .resource-pill {
      margin-top: 14px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
    }

    .panels-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      margin-bottom: 18px;
    }

    .panel-card {
      padding: 22px;
      display: grid;
      gap: 18px;
      min-height: 430px;
      align-content: start;
    }

    .panel-card.red {
      background:
        linear-gradient(180deg, rgba(255, 93, 93, 0.1), rgba(255, 93, 93, 0.02)),
        var(--panel);
    }

    .panel-card.orange {
      background:
        linear-gradient(180deg, rgba(255, 179, 71, 0.1), rgba(255, 179, 71, 0.02)),
        var(--panel);
    }

    .panel-card.green {
      background:
        linear-gradient(180deg, rgba(79, 213, 139, 0.1), rgba(79, 213, 139, 0.02)),
        var(--panel);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 12px;
    }

    .panel-kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .panel-kicker.red {
      background: var(--red-soft);
      color: #ff9e9e;
    }

    .panel-kicker.orange {
      background: var(--orange-soft);
      color: #ffd08d;
    }

    .panel-kicker.green {
      background: var(--green-soft);
      color: #9df2be;
    }

    .score-value {
      font-size: 3.5rem;
      line-height: 0.9;
      font-family: "Space Grotesk", sans-serif;
    }

    .score-label {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .delta {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .delta.red { color: #ff9090; }
    .delta.orange { color: #ffd08d; }
    .delta.green { color: #8cefb4; }

    .chart-card {
      border-radius: 22px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .chart-card svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .timeline {
      display: grid;
      gap: 12px;
    }

    .timeline-item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .timeline-time {
      min-width: 56px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .timeline-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 72px;
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .timeline-badge.red {
      background: var(--red-soft);
      color: #ff9d9d;
    }

    .timeline-badge.orange {
      background: var(--orange-soft);
      color: #ffd08d;
    }

    .timeline-badge.green {
      background: var(--green-soft);
      color: #98f0ba;
    }

    .panel-footer {
      display: grid;
      gap: 12px;
      margin-top: auto;
    }

    .footer-stat {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .footer-stat strong { font-size: 1rem; }

    .helper-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 18px;
    }

    .ai-section {
      margin-bottom: 18px;
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .ai-section-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 16px;
      margin-bottom: 18px;
    }

    .ai-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
    }

    .api-key-input {
      min-width: 260px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
      outline: none;
    }

    .secondary-button {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
      cursor: pointer;
    }

    .secondary-button:disabled,
    .connect-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .ai-status {
      margin-bottom: 14px;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: var(--muted);
    }

    .ai-card-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .ai-card {
      display: grid;
      gap: 14px;
      padding: 18px;
      border-radius: 22px;
      background:
        linear-gradient(180deg, rgba(124, 184, 255, 0.06), rgba(255, 255, 255, 0.02)),
        var(--panel-strong);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .ai-card h3 {
      font-size: 1.2rem;
    }

    .ai-card-block {
      display: grid;
      gap: 6px;
    }

    .ai-card-block strong {
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #c7d4e8;
    }

    .resource-card,
    .source-card {
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .resource-list,
    .source-list {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }

    .resource-item,
    .source-item {
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .source-item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 6px rgba(79, 213, 139, 0.12);
    }

    @media (max-width: 1100px) {
      .summary-grid,
      .helper-grid,
      .panels-grid,
      .ai-card-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 820px) {
      .dashboard-header {
        align-items: start;
        flex-direction: column;
      }

      .header-actions {
        width: 100%;
        justify-content: stretch;
      }

      .control,
      .connect-button {
        width: 100%;
      }

      .hero-metrics {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 540px) {
      .app-shell {
        width: min(100% - 20px, 1320px);
        padding-top: 18px;
      }

      .hero-card,
      .panel-card,
      .resource-card,
      .source-card,
      .insight-card,
      .heads-up,
      .dashboard-header {
        border-radius: 20px;
      }

      .hero-metrics {
        grid-template-columns: 1fr;
      }

      .timeline-item {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useEffect, useMemo, useState } = React;

    const weeklyData = [
      {
        id: "mar03",
        label: "Mar 3 - Mar 9",
        sourceState: "4 sources connected",
        burnout: {
          score: 58,
          delta: -4,
          series: [44, 49, 53, 51, 57, 60, 58],
          insights: [
            { label: "Deep focus lost", value: "3 blocks", note: "Interrupted mornings rose after Wednesday." },
            { label: "Recovery gap", value: "6h", note: "Average sleep window before high-load days." }
          ]
        },
        onCall: {
          incidents: 3,
          averageTime: "1:40 AM",
          bars: [1, 0, 2, 0, 0, 1, 0],

            { time: "12:18 AM", detail: "Database failover page", severity: "High" },
            { time: "1:42 AM", detail: "Retry queue saturation", severity: "Medium" },

        },

        },

          observation: "On-call interruptions stayed concentrated to one night, and your work blocks recovered quickly after Thursday.",
          suggestion: "Keep Friday as a low-meeting recovery day and preserve the 30-minute shutdown routine."
        }
      },
      {
        id: "mar10",
        label: "Mar 10 - Mar 16",
        sourceState: "5 sources connected",
        burnout: {
          score: 64,
          delta: 6,
          series: [48, 52, 55, 60, 63, 66, 64],
          insights: [
            { label: "Meeting spillover", value: "9.5h", note: "Context switching peaked on Tuesday and Wednesday." },
            { label: "Focus debt", value: "41%", note: "Protected time dropped below your baseline." }
          ]
        },
        onCall: {
          incidents: 4,
          averageTime: "2:03 AM",
          bars: [0, 1, 0, 2, 1, 0, 0],
          log: [
            { time: "11:54 PM", detail: "Auth timeout wave", severity: "Medium" },
            { time: "2:07 AM", detail: "Primary region alert", severity: "High" },
            { time: "2:33 AM", detail: "Secondary verification page", severity: "Medium" },
            { time: "3:11 AM", detail: "Customer escalation follow-up", severity: "Low" }
          ]
        },
        boundary: {
          score: 72,
          delta: -2,
          series: [76, 78, 74, 71, 73, 70, 72],
          afterHours: 38,
          note: "Slack activity moved later into the evening on three consecutive days."
        },
        insight: {
          observation: "After-hours activity increased 40% and overlapped with two back-to-back incident nights.",
          suggestion: "Cap post-incident follow-up work at one hour the next day and shift low-priority syncs to async updates."
        }
      },
      {
        id: "mar17",
        label: "Mar 17 - Mar 23",
        sourceState: "6 sources connected",
        burnout: {
          score: 78,
          delta: 14,
          series: [57, 61, 66, 72, 74, 79, 78],
          insights: [
            { label: "Sustained overload", value: "4 days", note: "Stress markers stayed elevated past your normal reset window." },
            { label: "Recovery debt", value: "52%", note: "Break adherence dropped while task switching climbed." }
          ]
        },
        onCall: {
          incidents: 6,
          averageTime: "2:26 AM",
          bars: [1, 1, 0, 2, 1, 1, 0],
          log: [
            { time: "12:09 AM", detail: "API latency page", severity: "High" },
            { time: "1:13 AM", detail: "Rollback coordination", severity: "High" },
            { time: "2:24 AM", detail: "Metrics threshold breach", severity: "Medium" },
            { time: "2:41 AM", detail: "Repeat alert suppression", severity: "Medium" },
            { time: "3:06 AM", detail: "Support handoff", severity: "Low" }
          ]
        },
        boundary: {
          score: 61,
          delta: -11,
          series: [72, 70, 68, 66, 64, 62, 61],
          afterHours: 46,
          note: "Weekend catch-up work resurfaced and personal blocks were frequently overridden."
        },
        insight: {
          observation: "Risk climbed into a sustained red zone while late-night incident recovery spilled into daytime planning work.",
          suggestion: "Reduce optional workload this week, move one project deadline if possible, and ask for backup coverage on the next on-call shift."
        }
      }
    ];

    const dayLabels = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
    const anthropicSystemPrompt = `You are a workplace wellbeing assistant for tech workers.
Your role is to help users understand their work patterns
and build healthier habits.

You MUST follow these rules at all times:
- Never diagnose any mental health condition
- Never use clinical language like "anxiety", "depression",
  or "burnout diagnosis"
- Always frame insights as observations about patterns,
  not conclusions about the person
- If a user expresses distress, immediately respond with
  empathy and direct them to professional support,
  then stop engaging on that topic
- Use supportive, non-judgmental language at all times
- Always position suggestions as options, never as prescriptions

Your insight cards should follow this format:
- Observation: what the data shows (neutral, factual)
- Context: how it compares to healthy benchmarks
- Suggestion: one small actionable habit to try
- Reminder: you are not a substitute for professional support

When burnout risk score exceeds 70/100, always append:
"If you're feeling overwhelmed, please consider speaking
with your manager, a trusted colleague, or a mental health
professional. Your company's EAP is a great place to start."`;

    const defaultSupportReminder = "This dashboard is not a substitute for professional support. If patterns feel hard to manage, consider reaching out to your manager, EAP, or a licensed professional.";
    const eapResourceLink = "https://www.samhsa.gov/find-help/national-helpline";
    const benchmarkReference = {
      burnoutHealthyRange: "A steadier week usually stays below 55/100 burnout risk with at least one visible recovery block after high-load days.",
      onCallHealthyRange: "A healthier on-call week usually keeps overnight incidents at 0-2 and avoids repeated alerts after 2:00 AM.",
      boundaryHealthyRange: "Boundary health is typically stronger above 75/100 when after-hours work stays under 25%."
    };

    function checkGuardrails(input, output) {
      const distressSignals = [
        "i can't cope",
        "i give up",
        "i don't want to work anymore",
        "i'm falling apart",
        "i need help"
      ];
      const clinicalLanguage = [
        "diagnosed",
        "disorder",
        "depressed",
        "anxiety disorder",
        "mentally ill",
        "burnout diagnosis"
      ];

      const normalizedInput = String(input || "").toLowerCase();
      const normalizedOutput = String(output || "").toLowerCase();
      const distressMatch = distressSignals.find((phrase) => normalizedInput.includes(phrase));
      const clinicalMatch = clinicalLanguage.find((phrase) => normalizedOutput.includes(phrase));

      if (distressMatch || clinicalMatch) {
        return {
          blocked: true,
          reason: distressMatch ? "distress_signal" : "clinical_language",
          safeMessage: distressMatch
            ? "I'm sorry you're carrying so much right now. You deserve support from a person who can help in real time, so please reach out to your manager, your Employee Assistance Program, or a trusted professional."
            : "I want to keep this supportive and avoid clinical framing. Please consider reaching out to your Employee Assistance Program, your manager, or a licensed professional for more direct support.",
          eapLink: eapResourceLink,
          output: null
        };
      }

      return {
        blocked: false,
        reason: null,
        safeMessage: null,
        eapLink: null,
        output
      };
    }

    function formatDelta(value, suffix = "pts vs last week") {
      if (value === 0) return `No change ${suffix}`;
      const sign = value > 0 ? "+" : "";
      return `${sign}${value} ${suffix}`;
    }

    function fallbackInsightsForWeek(week) {
      const elevated = week.burnout.score > 70;
      return [
        {
          title: "Burnout signal",
          observation: `Burnout risk is ${week.burnout.score}/100 and stayed elevated across ${week.burnout.series.filter((value) => value >= 70).length || 1} day(s).`,
          benchmarkComparison: benchmarkReference.burnoutHealthyRange,
          suggestion: "Try protecting one no-meeting recovery block after the heaviest day this week.",
          professionalSupportReminder: elevated
            ? "If you're feeling overwhelmed, please consider speaking with your manager, a trusted colleague, or a mental health professional. Your company's EAP is a great place to start."
            : defaultSupportReminder
        },
        {
          title: "On-call load",
          observation: `${week.onCall.incidents} incident(s) landed this week, with the average alert arriving around ${week.onCall.averageTime}.`,
          benchmarkComparison: benchmarkReference.onCallHealthyRange,
          suggestion: "If possible, shift one follow-up task out of the day after an overnight alert.",
          professionalSupportReminder: defaultSupportReminder
        },
        {
          title: "Boundary pattern",
          observation: `Boundary health is ${week.boundary.score}/100 and after-hours activity reached ${week.boundary.afterHours}% of tracked work.`,
          benchmarkComparison: benchmarkReference.boundaryHealthyRange,
          suggestion: "Consider setting a visible stop time on one or two evenings to help restore a clearer endpoint.",
          professionalSupportReminder: defaultSupportReminder
        }
      ];
    }

    function extractTextFromAnthropicResponse(payload) {
      if (!payload || !Array.isArray(payload.content)) return "";
      return payload.content
        .filter((block) => block.type === "text" && typeof block.text === "string")
        .map((block) => block.text)
        .join("\n")
        .trim();
    }

    function parseInsightCards(text, week) {
      try {
        const cleaned = text.replace(/^```json\s*/i, "").replace(/^```\s*/i, "").replace(/\s*```$/i, "").trim();
        const parsed = JSON.parse(cleaned);
        if (!Array.isArray(parsed)) return fallbackInsightsForWeek(week);
        return parsed.slice(0, 3).map((item, index) => ({
          title: item.title || `Insight ${index + 1}`,
          observation: item.observation || "No observation returned.",
          benchmarkComparison: item.benchmarkComparison || item.context || "No benchmark comparison returned.",
          suggestion: item.suggestion || "No suggestion returned.",
          professionalSupportReminder: item.professionalSupportReminder || item.reminder || defaultSupportReminder
        }));
      } catch (error) {
        return fallbackInsightsForWeek(week);
      }
    }

    function buildAnthropicUserPrompt(week) {
      return [
        "Generate exactly 3 wellbeing insight cards as a JSON array.",
        "Each object must have these string fields: title, observation, benchmarkComparison, suggestion, professionalSupportReminder.",
        "Keep each field concise and supportive.",
        "Use only the data below and do not diagnose anything.",
        "",
        `Week: ${week.label}`,
        `Burnout risk score: ${week.burnout.score}/100`,
        `Burnout week-over-week delta: ${week.burnout.delta}`,
        `Burnout trend: ${week.burnout.series.join(", ")}`,
        `On-call incidents: ${week.onCall.incidents}`,
        `Average on-call alert time: ${week.onCall.averageTime}`,
        `On-call daily counts: ${week.onCall.bars.join(", ")}`,
        `Boundary health score: ${week.boundary.score}/100`,
        `Boundary week-over-week delta: ${week.boundary.delta}`,
        `Boundary trend: ${week.boundary.series.join(", ")}`,
        `After-hours activity: ${week.boundary.afterHours}%`,
        `Weekly note: ${week.boundary.note}`,
        `Benchmark reference for burnout: ${benchmarkReference.burnoutHealthyRange}`,
        `Benchmark reference for on-call load: ${benchmarkReference.onCallHealthyRange}`,
        `Benchmark reference for boundaries: ${benchmarkReference.boundaryHealthyRange}`
      ].join("\n");
    }

    function linePath(values, width, height, padding) {
      const innerW = width - padding * 2;
      const innerH = height - padding * 2;
      const min = Math.min(...values) - 5;
      const max = Math.max(...values) + 5;
      return values.map((value, index) => {
        const x = padding + (innerW / (values.length - 1)) * index;
        const y = padding + innerH - ((value - min) / (max - min || 1)) * innerH;
        return `${index === 0 ? "M" : "L"} ${x} ${y}`;
      }).join(" ");
    }

    function areaPath(values, width, height, padding) {
      const innerW = width - padding * 2;
      const innerH = height - padding * 2;
      const min = Math.min(...values) - 5;
      const max = Math.max(...values) + 5;
      const top = values.map((value, index) => {
        const x = padding + (innerW / (values.length - 1)) * index;
        const y = padding + innerH - ((value - min) / (max - min || 1)) * innerH;
        return `${index === 0 ? "M" : "L"} ${x} ${y}`;
      }).join(" ");
      return `${top} L ${width - padding} ${height - padding} L ${padding} ${height - padding} Z`;
    }

    function LineChart({ values, color, softColor, labels }) {
      const width = 320;
      const height = 170;
      const padding = 18;
      return (
        <div className="chart-card">
          <svg viewBox={`0 0 ${width} ${height}`} role="img" aria-label="Trend chart">
            <defs>
              <linearGradient id={`fill-${color.replace("#", "")}`} x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stopColor={softColor} />
                <stop offset="100%" stopColor="rgba(255,255,255,0)" />
              </linearGradient>
            </defs>
            {[0, 1, 2, 3].map((row) => {
              const y = padding + ((height - padding * 2) / 3) * row;
              return <line key={row} x1={padding} x2={width - padding} y1={y} y2={y} stroke="rgba(255,255,255,0.08)" strokeWidth="1" />;
            })}
            <path d={areaPath(values, width, height, padding)} fill={`url(#fill-${color.replace("#", "")})`} />
            <path d={linePath(values, width, height, padding)} fill="none" stroke={color} strokeWidth="3" strokeLinecap="round" />
            {values.map((value, index) => {
              const innerW = width - padding * 2;
              const innerH = height - padding * 2;
              const min = Math.min(...values) - 5;
              const max = Math.max(...values) + 5;
              const x = padding + (innerW / (values.length - 1)) * index;
              const y = padding + innerH - ((value - min) / (max - min || 1)) * innerH;
              return (
                <g key={index}>
                  <circle cx={x} cy={y} r="4.5" fill={color} />
                  <text x={x} y={height - 2} textAnchor="middle" fill="#8d98ab" fontSize="10">{labels[index]}</text>
                </g>
              );
            })}
          </svg>
        </div>
      );
    }

    function BarChart({ values, color }) {
      const max = Math.max(...values, 1);
      return (
        <div className="chart-card">
          <svg viewBox="0 0 320 170" role="img" aria-label="On-call activity chart">
            {[0, 1, 2, 3].map((row) => {
              const y = 20 + 35 * row;
              return <line key={row} x1="12" x2="308" y1={y} y2={y} stroke="rgba(255,255,255,0.08)" strokeWidth="1" />;
            })}
            {values.map((value, index) => {
              const barWidth = 24;
              const gap = 18;
              const x = 28 + index * (barWidth + gap);
              const barHeight = (value / max) * 92;
              const y = 128 - barHeight;
              return (
                <g key={index}>
                  <rect x={x} y={y} width={barWidth} height={barHeight} rx="8" fill={color} />
                  <text x={x + barWidth / 2} y="152" textAnchor="middle" fill="#8d98ab" fontSize="10">{dayLabels[index]}</text>
                  <text x={x + barWidth / 2} y={y - 8} textAnchor="middle" fill="#f4f7fb" fontSize="11">{value}</text>
                </g>
              );
            })}
          </svg>
        </div>
      );
    }

    function Panel({ tone, title, subtitle, score, delta, chart, children, footer }) {
      return (
        <section className={`panel-card ${tone}`}>
          <div className="panel-header">
            <div>
              <span className={`panel-kicker ${tone}`}>{subtitle}</span>
              <h2 style={{ marginTop: 12 }}>{title}</h2>
            </div>
          </div>
          <div className="score-label">
            <div className="score-value">{score}</div>
            <div className={`delta ${tone}`}>{delta}</div>
          </div>
          {chart}
          {children}
          <div className="panel-footer">{footer}</div>
        </section>
      );
    }

    function AiInsightSection({ week }) {
      const [apiKey, setApiKey] = useState(() => window.localStorage.getItem("anthropic_api_key") || "");
      const [cards, setCards] = useState(() => fallbackInsightsForWeek(week));
      const [status, setStatus] = useState("Add an Anthropic API key to generate live insight cards, or use the fallback examples shown here.");
      const [isLoading, setIsLoading] = useState(false);

      useEffect(() => {
        setCards(fallbackInsightsForWeek(week));
      }, [week]);

      useEffect(() => {
        window.localStorage.setItem("anthropic_api_key", apiKey);
      }, [apiKey]);

      async function generateInsights() {
        if (!apiKey.trim()) {
          setStatus("Enter an Anthropic API key to request live cards. The current cards are local fallbacks.");
          setCards(fallbackInsightsForWeek(week));
          return;
        }

        setIsLoading(true);
        setStatus(`Generating insight cards for ${week.label}...`);

        try {
          const response = await fetch("https://api.anthropic.com/v1/messages", {
            method: "POST",
            headers: {
              "content-type": "application/json",
              "x-api-key": apiKey.trim(),
              "anthropic-version": "2023-06-01"
            },
            body: JSON.stringify({
              model: "claude-sonnet-4-20250514",
              max_tokens: 900,
              system: anthropicSystemPrompt,
              messages: [
                {
                  role: "user",
                  content: buildAnthropicUserPrompt(week)
                }
              ]
            })
          });

          if (!response.ok) {
            const errorText = await response.text();
            throw new Error(errorText || `HTTP ${response.status}`);
          }

          const payload = await response.json();
          const text = extractTextFromAnthropicResponse(payload);
          const parsedCards = parseInsightCards(text, week);
          setCards(parsedCards);
          setStatus(`Live Claude insights loaded for ${week.label}.`);
        } catch (error) {
          setCards(fallbackInsightsForWeek(week));
          setStatus(`Live generation failed, so fallback cards are shown instead. ${error.message ? String(error.message).slice(0, 180) : ""}`.trim());
        } finally {
          setIsLoading(false);
        }
      }

      return (
        <section className="ai-section">
          <div className="ai-section-header">
            <div>
              <span className="eyebrow">AI Insight Cards</span>
              <h2 style={{ marginTop: 14, fontSize: "1.55rem" }}>Claude-generated weekly coaching cards</h2>
              <p className="resource-copy" style={{ marginTop: 8, maxWidth: "64ch" }}>
                Each card includes an observation, benchmark comparison, suggestion, and professional support reminder using the system prompt stored in this workspace.
              </p>
            </div>
            <div className="ai-controls">
              <input
                className="api-key-input"
                type="password"
                placeholder="Anthropic API key"
                value={apiKey}
                onChange={(event) => setApiKey(event.target.value)}
              />
              <button className="secondary-button" type="button" onClick={() => setApiKey("")}>Clear Key</button>
              <button className="connect-button" type="button" onClick={generateInsights} disabled={isLoading}>
                {isLoading ? "Generating..." : "Generate Cards"}
              </button>
            </div>
          </div>

          <div className="ai-status">{status}</div>

          <div className="ai-card-grid">
            {cards.map((card) => (
              <article className="ai-card" key={card.title}>
                <div>
                  <span className="insight-tag">Claude Card</span>
                  <h3 style={{ marginTop: 12 }}>{card.title}</h3>
                </div>
                <div className="ai-card-block">
                  <strong>Observation</strong>
                  <p className="resource-copy">{card.observation}</p>
                </div>
                <div className="ai-card-block">
                  <strong>Benchmark comparison</strong>
                  <p className="resource-copy">{card.benchmarkComparison}</p>
                </div>
                <div className="ai-card-block">
                  <strong>Suggestion</strong>
                  <p className="resource-copy">{card.suggestion}</p>
                </div>
                <div className="ai-card-block">
                  <strong>Professional support reminder</strong>
                  <p className="resource-copy">{card.professionalSupportReminder}</p>
                </div>
              </article>
            ))}
          </div>
        </section>
      );
    }

    function DashboardApp() {
      const [selectedWeek, setSelectedWeek] = useState(weeklyData[1].id);
      const week = useMemo(() => weeklyData.find((entry) => entry.id === selectedWeek) ?? weeklyData[0], [selectedWeek]);
      const burnoutAlert = week.burnout.score > 70;

      return (
        <main className="app-shell">
          <header className="dashboard-header">
            <div className="header-copy">
              <span className="eyebrow">Weekly Wellbeing Dashboard</span>
              <h1>Energy, load, and boundaries in one view.</h1>
              <p>Track burnout risk, on-call fatigue, and recovery patterns across the week without losing the bigger picture.</p>
            </div>
            <div className="header-actions">
              <div className="control">
                <label htmlFor="week-selector">Week</label>
                <select id="week-selector" value={selectedWeek} onChange={(event) => setSelectedWeek(event.target.value)}>
                  {weeklyData.map((option) => <option key={option.id} value={option.id}>{option.label}</option>)}
                </select>
              </div>
              <button className="connect-button" type="button">Connect Data Source</button>
            </div>
          </header>

          <section className="summary-grid">
            <article className="hero-card">
              <span className="eyebrow">{week.label}</span>
              <h2 style={{ fontSize: "2rem", marginTop: 14 }}>Weekly pattern summary</h2>
              <p style={{ marginTop: 10, maxWidth: "58ch" }}>
                Signals are blended from calendar load, incident response timing, and after-hours activity to surface when work intensity stops looking sustainable.
              </p>

              <div className="hero-metrics">
                <div className="mini-stat">
                  <span className="metric-caption">Burnout risk</span>
                  <strong>{week.burnout.score}/100</strong>
                  <p className="stat-note">{formatDelta(week.burnout.delta)}</p>
                </div>
                <div className="mini-stat">
                  <span className="metric-caption">On-call incidents</span>
                  <strong>{week.onCall.incidents}</strong>
                  <p className="stat-note">Average alert at {week.onCall.averageTime}</p>
                </div>
                <div className="mini-stat">
                  <span className="metric-caption">Boundary health</span>
                  <strong>{week.boundary.score}/100</strong>
                  <p className="stat-note">{formatDelta(week.boundary.delta)}</p>
                </div>
                <div className="mini-stat">
                  <span className="metric-caption">Connected inputs</span>
                  <strong>{week.sourceState}</strong>
                  <p className="stat-note">Calendar, incident logs, messaging, and manual check-ins</p>
                </div>
              </div>
            </article>

            <div className="insight-stack">
              <article className="insight-card">
                <span className="insight-tag">AI Insight Card</span>
                <h3 style={{ marginTop: 14, fontSize: "1.35rem" }}>Observation</h3>
                <p className="insight-text" style={{ marginTop: 8 }}>{week.insight.observation}</p>
                <h3 style={{ marginTop: 16, fontSize: "1.1rem" }}>Suggested next move</h3>
                <p className="insight-text" style={{ marginTop: 8 }}>{week.insight.suggestion}</p>
              </article>

              {burnoutAlert && (
                <article className="heads-up">
                  <span className="severity-pill">Heads Up</span>
                  <h3 style={{ marginTop: 14, fontSize: "1.35rem" }}>Elevated risk detected this week</h3>
                  <p className="resource-copy" style={{ marginTop: 8 }}>
                    Your recent pattern suggests sustained overload. It may help to reduce optional work, involve your manager or team lead, and use professional support resources available through your organization.
                  </p>
                  <span className="resource-pill">Professional support reminder included because risk is above 70.</span>
                </article>
              )}
            </div>
          </section>

          <section className="panels-grid">
            <Panel
              tone="red"
              title="Burnout Risk Tracker"
              subtitle="Red Zone"
              score={`${week.burnout.score}/100`}
              delta={formatDelta(week.burnout.delta)}
              chart={<LineChart values={week.burnout.series} color="#ff5d5d" softColor="rgba(255,93,93,0.28)" labels={dayLabels} />}
              footer={week.burnout.insights.map((item) => (
                <div className="footer-stat" key={item.label}>
                  <div>
                    <strong>{item.label}</strong>
                    <p className="footer-note">{item.note}</p>
                  </div>
                  <span className="timeline-badge red">{item.value}</span>
                </div>
              ))}
            >
              <p className="panel-subtitle">Daily stress score based on meeting load, fragmentation, recovery time, and interruption spillover.</p>
            </Panel>

            <Panel
              tone="orange"
              title="On-Call Fatigue Log"
              subtitle="Orange Zone"
              score={String(week.onCall.incidents)}
              delta={`Avg page ${week.onCall.averageTime}`}
              chart={<BarChart values={week.onCall.bars} color="#ffb347" />}
              footer={[
                <div className="footer-stat" key="incident-rate">
                  <div>
                    <strong>Night disruption spread</strong>
                    <p className="footer-note">Three or more overnight touchpoints usually predicts slower next-day recovery.</p>
                  </div>
                  <span className="timeline-badge orange">{week.onCall.incidents} alerts</span>
                </div>
              ]}
            >
              <div className="timeline">
                {week.onCall.log.map((entry) => {
                  const tone = entry.severity === "High" ? "red" : entry.severity === "Medium" ? "orange" : "green";
                  return (
                    <div className="timeline-item" key={`${entry.time}-${entry.detail}`}>
                      <span className="timeline-time">{entry.time}</span>
                      <div className="timeline-copy">{entry.detail}</div>
                      <span className={`timeline-badge ${tone}`}>{entry.severity}</span>
                    </div>
                  );
                })}
              </div>
            </Panel>

            <Panel
              tone="green"
              title="Boundary Health Score"
              subtitle="Green Zone"
              score={`${week.boundary.score}/100`}
              delta={formatDelta(week.boundary.delta)}
              chart={<LineChart values={week.boundary.series} color="#4fd58b" softColor="rgba(79,213,139,0.26)" labels={dayLabels} />}
              footer={[
                <div className="footer-stat" key="after-hours">
                  <div>
                    <strong>After-hours activity</strong>
                    <p className="footer-note">Share of messages, calendar edits, and task completion happening outside preferred work windows.</p>
                  </div>
                  <span className="timeline-badge green">{week.boundary.afterHours}%</span>
                </div>,
                <div className="footer-stat" key="boundary-note">
                  <div>
                    <strong>Boundary note</strong>
                    <p className="footer-note">{week.boundary.note}</p>
                  </div>
                  <span className="timeline-badge green">Tracked</span>
                </div>
              ]}
            >
              <p className="panel-subtitle">A higher score means personal time stayed protected and work stayed closer to planned hours.</p>
            </Panel>
          </section>

          <AiInsightSection week={week} />

          <section className="helper-grid">
            <article className="resource-card">
              <span className="eyebrow">Healthy habit nudges</span>
              <h2 style={{ marginTop: 14, fontSize: "1.5rem" }}>What the app would recommend next</h2>
              <div className="resource-list">
                <div className="resource-item">
                  <strong>Protect one recovery block</strong>
                  <p className="resource-copy">Reserve a meeting-free hour after any overnight page so recovery is visible in the calendar.</p>
                </div>
                <div className="resource-item">
                  <strong>Reduce post-incident follow-up load</strong>
                  <p className="resource-copy">Avoid stacking planning work immediately after interruption-heavy nights when the risk score is rising.</p>
                </div>
                <div className="resource-item">
                  <strong>Rebuild the shutdown ritual</strong>
                  <p className="resource-copy">A short end-of-day handoff note lowers the chance that evening work expands into personal time.</p>
                </div>
              </div>
            </article>

            <article className="source-card">
              <span className="eyebrow">Connection status</span>
              <h2 style={{ marginTop: 14, fontSize: "1.5rem" }}>Data sources ready for sync</h2>
              <div className="source-list">
                {["Work calendar", "Pager rotation logs", "Messaging activity", "Manual wellbeing check-in"].map((item) => (
                  <div className="source-item" key={item}>
                    <span>{item}</span>
                    <span className="status-dot" aria-hidden="true"></span>
                  </div>
                ))}
              </div>
            </article>
          </section>
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<DashboardApp />);
  </script>
</body>
</html>
